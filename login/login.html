<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripplab - Oturum Aç</title>
    <link rel="icon" type="image/png" href="assets/favicon logo.png" sizes="16x16">
    <link rel="icon" type="image/png" href="assets/favicon logo.png" sizes="32x32">
    <link rel="icon" type="image/png" href="assets/favicon logo.png" sizes="64x64">
    <link rel="icon" type="image/png" href="assets/favicon logo.png" sizes="128x128">
    <link rel="icon" type="image/png" href="assets/favicon logo.png" sizes="256x256">
    <link rel="icon" type="image/png" href="assets/favicon logo.png" sizes="512x512">
    <link rel="icon" type="image/png" href="assets/favicon logo.png" sizes="1024x1024">
    <link rel="icon" type="image/png" href="assets/favicon logo.png" sizes="2048x2048">
    <link rel="icon" type="image/png" href="assets/favicon logo.png" sizes="4096x4096">
    <link rel="apple-touch-icon" href="assets/favicon logo.png" sizes="8192x8192">
    <link rel="stylesheet" href="auth.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>


    <!-- Hidden Audio for Background Music Continuity -->
    <audio id="background-music" loop style="display: none;" preload="auto">
        <source src="assets/dalga.mp3" type="audio/mpeg">
    </audio>



    <!-- Main Content -->
    <main class="main">
        <!-- Auth Section -->
        <section class="auth-section">
            <div class="auth-container">
                <div class="auth-header">
                    <h1 class="auth-title">Hoş Geldiniz</h1>
                    <p class="auth-subtitle">Müzik dünyasına giriş yapın</p>
                </div>
                
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="switchTab('login')">
                        <i class="fas fa-sign-in-alt"></i>
                        Giriş Yap
                    </button>
                    <button class="tab-btn" onclick="switchTab('register')">
                        <i class="fas fa-user-plus"></i>
                        Kayıt Ol
                    </button>
                </div>

                <!-- Login Form -->
                <div class="auth-form active" id="login-form">
                    <form class="form">
                        <div class="form-group">
                            <label for="login-email">E-posta</label>
                            <input type="email" id="login-email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Şifre</label>
                            <input type="password" id="login-password" name="password" required>
                        </div>
                        <div class="form-options">
                            <label class="checkbox">
                                <input type="checkbox" name="remember">
                                <span class="checkmark"></span>
                                <span id="remember-me-text">Beni hatırla</span>
                            </label>
                            <a href="#" class="forgot-password" id="forgot-password-link">Şifremi unuttum</a>
                        </div>
                        <button type="button" class="auth-btn" onclick="window.location.href='../Home/index.html'">
                            <i class="fas fa-sign-in-alt"></i>
                            Giriş Yap
                        </button>
                    </form>
                    

                </div>

                <!-- Register Form -->
                <div class="auth-form" id="register-form">
                    <form class="form">
                        <div class="form-group">
                            <label for="register-name">Ad Soyad</label>
                            <input type="text" id="register-name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="register-email">E-posta</label>
                            <input type="email" id="register-email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="register-password">Şifre</label>
                            <input type="password" id="register-password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label for="register-confirm">Şifre Tekrar</label>
                            <input type="password" id="register-confirm" name="confirm" required>
                        </div>
                        <div class="form-options">
                            <label class="checkbox">
                                <input type="checkbox" name="terms">
                                <span class="checkmark"></span>
                                <a href="terms.html" class="terms-link" id="terms-link">Kullanım şartlarını</a> <span id="accept-terms-suffix-text">kabul ediyorum</span>
                            </label>
                        </div>
                        <button type="button" class="auth-btn" onclick="window.location.href='../Home/index.html'">
                            <i class="fas fa-user-plus"></i>
                            Kayıt Ol
                        </button>
                    </form>
                    
                    <!-- Social Login Divider -->
                    <div class="social-divider">
                        <span>veya</span>
                    </div>
                    
                    <!-- Social Login Buttons -->
                    <div class="social-login">
                        <button type="button" class="social-btn facebook-btn" onclick="window.location.href='../Home/index.html'">
                            <i class="fab fa-facebook-f"></i>
                            Facebook
                        </button>
                        <button type="button" class="social-btn google-btn" onclick="window.location.href='../Home/index.html'">
                            <i class="fab fa-google"></i>
                            Google
                        </button>
                    </div>
                </div>

                <div class="auth-footer">
                    <a href="../lobi/index.html" class="back-home">
                        <i class="fas fa-arrow-left"></i>
                        <span id="back-home-text">Lobi'ye Dön</span>
                    </a>
                </div>
            </div>
        </section>
    </main>



    <script src="auth.js?v=1"></script>
    
    <!-- Apply Saved Theme from Lobi -->
    <script>
        // Apply saved theme from localStorage (set by lobi page)
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
            }
        });
    </script>
</body>
</html>
