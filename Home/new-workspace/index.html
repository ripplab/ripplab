<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripplab - Yeni Eser</title>
    <link rel="icon" type="image/png" href="../assets/favicon logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <div class="logo">
                <a href="../index.html" class="logo-link">
                    <span class="logo-text">Ripplab</span>
                </a>
            </div>
            
            <div class="header-controls">
                <div class="user-menu">
                    <button class="user-btn">
                        <i class="fas fa-user"></i>
                    </button>
                    <div class="user-dropdown">
                        <a href="#" class="dropdown-item">
                            <i class="fas fa-user"></i>
                            Profil
                        </a>
                        <a href="#" class="dropdown-item">
                            <i class="fas fa-wallet"></i>
                            Cüzdan: ₺150
                        </a>
                        <a href="../settings/index.html" class="dropdown-item">
                            <i class="fas fa-cog"></i>
                            Ayarlar
                        </a>
                        <a href="#" class="dropdown-item">
                            <i class="fas fa-sign-out-alt"></i>
                            Çıkış
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="page-container">
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-plus"></i>
                    Yeni Eser Oluştur
                </h1>
                <p class="page-subtitle">Müziğinizi dünyayla paylaşın</p>
            </div>

            <div class="upload-section">
                <div class="upload-card">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <h3>Dosya Yükle</h3>
                    <p>Müzik dosyanızı buraya sürükleyin veya seçin</p>
                    <input type="file" id="music-file" accept="audio/*" hidden>
                    <button class="upload-btn" onclick="document.getElementById('music-file').click()">
                        <i class="fas fa-folder-open"></i>
                        Dosya Seç
                    </button>
                    <div class="file-info" id="file-info" style="display: none;">
                        <div class="file-details">
                            <i class="fas fa-music"></i>
                            <span class="file-name"></span>
                            <span class="file-size"></span>
                        </div>
                        <button class="remove-file-btn" onclick="removeFile()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>

                <div class="form-section">
                    <form class="upload-form" id="upload-form">
                        <div class="form-group">
                            <label for="title">Eser Başlığı</label>
                            <input type="text" id="title" name="title" placeholder="Eserinizin başlığını girin" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Açıklama</label>
                            <textarea id="description" name="description" placeholder="Eseriniz hakkında detaylı bilgi verin" rows="4"></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="genre">Tür</label>
                                <select id="genre" name="genre" required>
                                    <option value="">Tür seçin</option>
                                    <option value="beat">Beat</option>
                                    <option value="electronic">Elektronik</option>
                                    <option value="pop">Pop</option>
                                    <option value="rock">Rock</option>
                                    <option value="hip-hop">Hip-Hop</option>
                                    <option value="classical">Klasik</option>
                                    <option value="jazz">Jazz</option>
                                    <option value="ambient">Ambient</option>
                                    <option value="other">Diğer</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="price">Fiyat (₺)</label>
                                <input type="number" id="price" name="price" placeholder="0.00" min="0" step="0.01">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="tags">Etiketler</label>
                            <input type="text" id="tags" name="tags" placeholder="etiket1, etiket2, etiket3">
                            <small>Etiketleri virgülle ayırın</small>
                        </div>

                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="public" name="public" checked>
                                <span class="checkmark"></span>
                                Herkese açık yap
                            </label>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-secondary" onclick="goBack()">
                                <i class="fas fa-arrow-left"></i>
                                Geri Dön
                            </button>
                            <button type="submit" class="btn-primary">
                                <i class="fas fa-upload"></i>
                                Eseri Yayınla
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
